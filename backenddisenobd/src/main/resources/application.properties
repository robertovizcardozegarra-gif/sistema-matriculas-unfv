spring.application.name=backenddisenobd

# Conexion MySQL. Define DB_PASSWORD en IntelliJ o en el sistema operativo.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_matriculas_unfv?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# La estructura la administra el SQL entregado; Hibernate solo la valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Seguridad. Cambia APP_JWT_SECRET fuera del ambiente local.
app.jwt.issuer=backenddisenobd
app.jwt.secret=${APP_JWT_SECRET:desarrollo-clave-jwt-cambiar-antes-de-publicar-2026}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:120}

# Si APP_ADMIN_PASSWORD tiene valor, se crea el administrador al primer inicio.
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.email=${APP_ADMIN_EMAIL:admin@unfv.edu.pe}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}
